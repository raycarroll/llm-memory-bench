api_version: llm-memory-bench.dev/v1
kind: AgentMemoryIntegration

metadata:
  name: memoryhub-remote-http
  version: 1.0.0

memory_system:
  name: memoryhub
  client_version: 0.15.3
  cli_version: 0.12.1
  bridge_fastmcp_version: 4.0.0

topology:
  kind: remote-http
  endpoint_env: MEMORYHUB_URL
  agent_transport: http
  authentication:
    - session-registration-tool
  runtime_env:
    required:
      - MEMORYHUB_URL
      - MEMORYHUB_API_KEY
  isolation: dedicated-project-id
  reset: unsupported

capabilities:
  - memory.read
  - memory.write
  - memory.search
  - session-start-hook
  - project-scoped-observation

required_context:
  - project_id

dependencies:
  python:
    - memoryhub-cli==0.12.1

platforms:
  claude-code:
    min_version: 1.0.33
    assets:
      - source: assets/.memoryhub.yaml
        target: .memoryhub.yaml
      - source: assets/.claude/rules/memoryhub-loading.md
        target: .claude/rules/memoryhub-loading.md
      - source: assets/.claude/hooks/load-memories.sh
        target: .claude/hooks/load-memories.sh
        mode: 493
      - source: assets/.claude/settings.json
        target: .claude/settings.json
    mcp:
      path: .mcp.json
      servers:
        memoryhub:
          url: "{{ MEMORYHUB_URL }}"
          type: http
    required_commands:
      - memoryhub

lifecycle:
  session_start:
    hook: .claude/hooks/load-memories.sh
  smoke_test:
    command:
      - bash
      - -c
      - |
        export SMOKE_TEST_TIMESTAMP=$(date -Iseconds)
        export SMOKE_TEST_MODEL="${SMOKE_TEST_MODEL:-claude-sonnet-4-5@20250929}"
        python3 /host-driver/smoke_test_memoryhub.py
  observe:
    command:
      - /opt/llm-memory-bench/integration-runtime/bin/memoryhub
      - list
      - --project-id
      - "${MEMORYHUB_PROJECT_ID}"
      - --output
      - json
      - --max
      - "1000"
  cleanup:
    command:
      - bash
      - -c
      - |
        set -e
        MH=/opt/llm-memory-bench/integration-runtime/bin/memoryhub
        echo "Cleaning all memories"

        # List ALL memories (suppress INFO logs by discarding stderr)
        MEMORIES=$($MH list --output json --max 1000 2>/dev/null)

        # Extract memory IDs from nested structure
        IDS=$(echo "$MEMORIES" | python3 -c '
        import sys, json
        data = json.load(sys.stdin)
        memories = data.get("data", {}).get("results", data.get("data", {}).get("memories", []))
        for m in memories:
            print(m.get("id", ""))
        ')

        # Delete each memory
        if [ -n "$IDS" ]; then
          TOTAL=$(echo "$IDS" | wc -l | tr -d " ")
          echo "Found $TOTAL memories, deleting..."
          echo "$IDS" | while IFS= read -r id; do
            [ -n "$id" ] && $MH delete "$id" --force --output quiet 2>/dev/null || true
          done
          echo "Cleanup complete"
        else
          echo "No memories to delete"
        fi
  reset:
    support: unsupported
    reason: >-
      Remote MemoryHub has no generic benchmark reset operation. A benchmark
      must allocate a dedicated project ID/account or provide a provider-side
      cleanup adapter before claiming isolated runs.
