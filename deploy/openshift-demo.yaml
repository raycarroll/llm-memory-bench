apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-memory-bench-demo-config
  namespace: llm-memory-bench
data:
  # Set this to the kubeconfig context for the intended cluster before deploy.
  OPENSHIFT_CONTEXT: ""
  MEMORYHUB_MCP_URL: http://memory-hub-mcp.memory-hub-mcp.svc.cluster.local:8080/mcp/
  K8S_MEMORY_MCP_URL: http://demo-memory-mcp.kubernetes-mcp-server.svc.cluster.local:8081/mcp
  K8S_BASELINE_MCP_URL: http://demo-baseline-mcp.kubernetes-mcp-server.svc.cluster.local:8082/mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bench-verifier
  namespace: demo-memory
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bench-verifier
  namespace: demo-memory
subjects:
  - kind: ServiceAccount
    name: default
    namespace: llm-memory-bench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bench-verifier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bench-verifier
  namespace: demo-baseline
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bench-verifier
  namespace: demo-baseline
subjects:
  - kind: ServiceAccount
    name: default
    namespace: llm-memory-bench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bench-verifier
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-memory-bench
  namespace: llm-memory-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-memory-bench
  template:
    metadata:
      labels:
        app: llm-memory-bench
      annotations:
        alpha.image.policy.openshift.io/resolve-names: '*'
    spec:
      containers:
        - name: ui
          # Build this image locally, tag it as :local, and push it to the
          # OpenShift internal registry before applying this manifest.
          image: llm-bench:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: llm-memory-bench-demo-config
          env:
            - name: MEMORYHUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: memoryhub-demo-credentials
                  key: api-key
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-memory-bench
  namespace: llm-memory-bench
spec:
  selector:
    app: llm-memory-bench
  ports:
    - name: http
      port: 8501
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: llm-memory-bench
  namespace: llm-memory-bench
spec:
  to:
    kind: Service
    name: llm-memory-bench
  port:
    targetPort: http
  tls:
    termination: edge
