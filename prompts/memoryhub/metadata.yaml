name: memoryhub
description: MemoryHub unified memory interface with lazy loading pattern

source:
  repo: https://github.com/rcarroll/memory-hub
  paths:
    prompt: memoryhub-cli/src/memoryhub_cli/project_config.py
    tool_schema: memory-hub-mcp/src/tools/memory.py
    write_format: memory-hub-mcp/src/tools/write_memory.py
  documentation: https://github.com/rcarroll/memory-hub
  notes: |
    System prompt: _UNIVERSAL_HEADER + _UNIVERSAL_PATTERN_BLOCKS["lazy"] + _HYGIENE_BLOCK
    from project_config.py. These are the generated agent instructions MemoryHub
    produces when a user runs `memoryhub config init` with the "lazy" loading
    pattern (the default for focused sessions).

    Tool schema: the unified memory(action=...) dispatcher with full docstring
    from memory.py. MemoryHub consolidates all operations into a single tool
    with an `action` parameter.

versions:
  - version: v1_lazy_2026-08
    commit: unknown
    pulled: 2026-08-31
    notes: |
      Lazy loading pattern (default configuration).
      Universal framework-agnostic instructions for MemoryHub integration.
      Single unified memory(action=...) tool with scoped writes, weighted
      memories, and content type classification.
    default: false
  - version: v2_proactive_2026-11
    commit: unknown
    pulled: 2026-11-03
    notes: |
      Proactive storage pattern for conversational memory extraction.
      Adds explicit "When to write memories" instructions with categories
      of facts to store (personal, preferences, goals, etc.) and examples
      of fact decomposition from user messages.
    default: true
  - version: v3_ben_capture_only_2026-11
    commit: local-derivative-of-BEN-comprehensive-rules
    pulled: 2026-11-12
    notes: |
      BEN-style comprehensive rules adapted for τ².
      Includes a capture-only prompt and write-only memory(action=write)
      schema for the baseline arm, plus a full prompt/schema for replay.
      The existing BEN source rule file is referenced by project documentation
      but is not present in this checkout; this artifact preserves its
      documented comprehensive categories and restrictions.
    default: false
  - version: v4_ben_clbench_2026-11
    commit: local-derivative-of-BEN-comprehensive-rules
    pulled: 2026-11-20
    notes: |
      Corrected BEN-derived bundle for CL-Bench. Separates the capture-only
      restriction from the normal MemoryHub working-set/search instructions.
      Adds explicit guidance to prefer reusable schema/procedural facts over
      unverified one-off computed answers.
    default: false
  - version: v5_clbench_capture_2026-11
    commit: local-clbench-capture-derivative
    pulled: 2026-11-25
    notes: |
      CL-Bench database-exploration prompt with explicit write-before-final-
      action instructions for capture-only sessions and replay guidance for
      fresh question sessions. Tailored to reusable schema and procedural
      facts rather than one-off query answers.
    default: true

default_version: v5_clbench_capture_2026-11
