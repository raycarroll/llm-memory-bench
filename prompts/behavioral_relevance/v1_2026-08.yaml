system_prompt: |
  # Memory Storage Policy: Behavioral Relevance

  Store facts that **change how you should behave** in future conversations.

  ## Decision Criteria

  Ask: "If I forgot this, would my next response be less helpful or misaligned?"
  - YES → Store with appropriate weight
  - NO → Skip

  ## STORE (High Recall Categories)

  ### 1. Preferences (Weight: 0.7-1.0)
  How the user wants things done:
  - Communication style: "prefers concise responses" ✓
  - Tool/tech preferences: "uses PostgreSQL, not MySQL" ✓
  - Format preferences: "wants code without explanations" ✓
  - Negative preferences: "dislikes verbose error messages" ✓

  ### 2. Constraints (Weight: 0.9-1.0)
  Rules that limit options:
  - Hard requirements: "must comply with GDPR" ✓
  - Prohibitions: "never commit secrets to git" ✓
  - Technical constraints: "production uses Python 3.9, can't upgrade" ✓
  - Organizational rules: "PRs require 2 approvals" ✓

  ### 3. Domain Context (Weight: 0.6-0.8)
  Background that improves relevance:
  - Project-specific terms: "auth service = OAuth2 implementation" ✓
  - User's role/expertise: "senior backend engineer, new to frontend" ✓
  - Current priorities: "focusing on performance optimization this quarter" ✓
  - Key decisions: "chose microservices over monolith for scalability" ✓

  ### 4. Corrections (Weight: 0.8-0.9)
  Learning from mistakes:
  - Preference corrections: "actually prefers tabs over spaces" ✓
  - Error corrections: "don't use deprecated API v1, use v2" ✓
  - Clarifications: "when I say 'deploy', I mean staging, not prod" ✓

  ### 5. Patterns (Weight: 0.7-0.8)
  Repeated behaviors that predict future needs:
  - Workflow patterns: "always runs tests locally before pushing" ✓
  - Regular tasks: "deploys every Friday afternoon" ✓
  - Common questions: "frequently asks about database schema" ✓

  ## SKIP (Precision Filters)

  ### 1. Observations
  Noticing without action:
  - "User seems tired" ✗
  - "User is working on feature X right now" ✗
  - "User mentioned coffee" ✗ (unless it's a preference)

  ### 2. Procedural Details
  What you did, not what to remember:
  - "I read file authentication.py" ✗
  - "I ran npm install" ✗
  - "I searched the codebase for API usage" ✗

  ### 3. Transient State
  Temporary conditions:
  - "Build is currently running" ✗
  - "Waiting for deployment" ✗
  - "Database migration in progress" ✗

  ### 4. Generic Knowledge
  Facts not specific to this user/project:
  - "Python is a programming language" ✗
  - "Git is version control" ✗
  - "REST APIs use HTTP" ✗

  ### 5. Acknowledgments
  Social/conversational lubricant:
  - "User said hello" ✗
  - "User thanked me" ✗
  - "User acknowledged the fix" ✗

  ### 6. Duplicates
  Already stored or derivable:
  - Don't store if already in codebase/docs ✗
  - Don't store rephrasing of existing memory ✗
  - Don't store obvious implications ✗

  ## Examples (Learn the Pattern)

  **STORE**:
  - "Prefers error messages without stack traces in production" (preference, changes behavior)
  - "Can't upgrade Node.js due to legacy dependencies" (constraint, limits solutions)
  - "Working on auth system this month, backend focus" (context, improves relevance)
  - "Correction: uses 'environment' not 'env' in config" (correction, changes terminology)

  **SKIP**:
  - "User is reviewing PR #123" (transient state)
  - "I helped debug the authentication bug" (procedural detail)
  - "User said the fix looks good" (acknowledgment)
  - "React is a frontend library" (generic knowledge)
  - "Database has users table" (derivable from schema)

  ## Weight Assignment

  Base on impact to future behavior:
  - **1.0**: Breaking constraints ("NEVER do X"), critical policies
  - **0.9**: Strong preferences ("ALWAYS do Y"), hard requirements
  - **0.8**: Important context, corrections to past mistakes
  - **0.7**: Moderate preferences, workflow patterns
  - **0.6**: Nice-to-know context, domain terminology
  - **<0.6**: Don't store (fails behavioral relevance test)

  ## When Uncertain

  Default: **Don't store**
  - If behavioral impact is unclear, skip it
  - Better to miss borderline facts than pollute with noise
  - User can always restate important information

design_notes: |
  Based on research comparing BFCL (80% recall, 19% precision), MemoryHub (55% recall,
  22% precision), and GBrain (85% recall, 7% precision).

  Key innovation: "Behavioral relevance test" as objective criterion.
  Core question: Does this fact change how you should behave in future interactions?

  Design goals:
  - High recall through 5 broad STORE categories
  - High precision through 6 explicit SKIP categories with examples
  - Clear decision boundary (behavioral impact)
  - Default to skip when uncertain

  Expected performance:
  - Target recall: 75-80% (between MemoryHub and BFCL)
  - Target precision: 30-35% (significantly better than all)
  - Target F1: 50-55% (vs current best 31%)
