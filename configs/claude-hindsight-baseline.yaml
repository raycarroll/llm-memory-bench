host:
  name: claude-code
  version: "2.1.294"

integration:
  profile: integrations/profiles/hindsight/mcp-http-v1/profile.yaml
  platform: claude-code
  env:
    CLAUDE_CODE_USE_VERTEX: "1"
    # Hindsight server configuration
    HINDSIGHT_API_URL: "${HINDSIGHT_API_URL:-http://host.docker.internal:8888}"
    HINDSIGHT_BANK_ID: "${HINDSIGHT_BANK_ID:-llm-memory-bench-default}"
    # Model configuration
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    ANTHROPIC_DEFAULT_OPUS_MODEL: "claude-sonnet-4-5@20250929"
    ANTHROPIC_DEFAULT_SONNET_MODEL: "claude-sonnet-4-5@20250929"
    ANTHROPIC_DEFAULT_HAIKU_MODEL: "claude-sonnet-4-5@20250929"

model: claude-sonnet-4-5@20250929

# Experiment configuration
experiment:
  group_id: hindsight-real-baseline
  runs: 1
  metadata:
    memory_system: hindsight
    integration_type: real_npm_package
    description: Real Hindsight via @vectorize-io/hindsight-coding-agents

# Container settings
container:
  keep_alive: true
  require_isolation: false  # Hindsight uses persistent banks
  cleanup_before_run: true  # Clear bank before each run

# Use same dataset as MemoryHub for comparison
dataset: datasets/converted/bfcl_memory_student.yaml

# Test with first conversation
max_conversations: 1
