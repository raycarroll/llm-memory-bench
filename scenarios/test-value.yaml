scenarios:
  - id: "test-001"
    memory_bank:
      - fact: "User is a vegetarian"
        category: "preference"
      - fact: "User hates garlic and spaghetti"
        category: "preference"
      - fact: "User lives in Portland, Oregon"
        category: "personal"
      - fact: "User prefers quick meals under 30 minutes"
        category: "preference"
    task_prompt: "Can you suggest a good dinner recipe for tonight?"
    outcomes:
      - id: vegetarian_recipe
        statement: "The response suggests a vegetarian dinner recipe."
      - id: personalised_recipe
        statement: "The response suggests dinner recipe that caters for the users perferences."
      - id: quick_recipe
        statement: "The recipe can be prepared in under 30 minutes."
      - id: actionable_recipe
        statement: "The response gives a specific, actionable recipe rather than only a category suggestion."
    validators:
      - type: llm_judge
    persona_prompt: |
      - You are a vegetarian
      - You live in Portland, Oregon
      - You prefer quick meals that take under 30 minutes to prepare
      - If the assistant asks about dietary restrictions, tell them you're vegetarian
      - If asked about time constraints, say you want something quick, under 30 minutes
    noise_memories: []