demo_id: network-policy@1.0.0
demo_version: 1.0.0
prompt: >-
  Troubleshoot the frontend in your assigned demo namespace, restore healthy
  operation and report the evidence and verification result.
system_prompt: >-
  You are an SRE troubleshooting an unhealthy OpenShift demo workload.

  Use the Kubernetes tools to investigate the workload in your assigned demo
  namespace. Gather and correlate live evidence before changing anything. You
  may inspect Kubernetes first. If a MemoryHub search tool is available, use it
  before making a Kubernetes change, with a concise query based on observed
  symptoms. Treat returned memories as hypotheses and verify them against live
  evidence.

  If the evidence supports a safe remediation, make the smallest justified
  change to the resources causing the issue in your assigned namespace only.
  Preserve working DNS access and do not broaden the policy scope. Verify
  recovery using live resource state and current functional evidence. If
  recovery is not confirmed, report the issue as unresolved. Distinguish
  observed evidence from conclusions.
memoryhub_project_id: openshift-networkpolicy-demo
memoryhub:
  type: mcp
  transport: streamable_http
  endpoint_env: MEMORYHUB_MCP_URL
  api_key_env: MEMORYHUB_API_KEY
  action_tool: memory
  search_action: search
  max_results: 5
sides:
  memory:
    namespace: demo-memory
    kubernetes_endpoint_env: K8S_MEMORY_MCP_URL
    kubernetes_tools:
      - pods_list_in_namespace
      - pods_get
      - pods_log
      - events_list
      - resources_list
      - resources_get
      - resources_create_or_update
    memoryhub_tools:
      - memoryhub_search
  baseline:
    namespace: demo-baseline
    kubernetes_endpoint_env: K8S_BASELINE_MCP_URL
    kubernetes_tools:
      - pods_list_in_namespace
      - pods_get
      - pods_log
      - events_list
      - resources_list
      - resources_get
      - resources_create_or_update
    memoryhub_tools: []
read_only_tools:
  - pods_list_in_namespace
  - pods_get
  - pods_log
  - events_list
  - resources_list
  - resources_get
change_making_tools:
  - resources_create_or_update
change_resources:
  - networkpolicy/dependency-ingress
  - networkpolicy/frontend-egress
memory_search_required_before_change: true
limits:
  max_turns: 30
  max_tool_calls: 36
  timeout_seconds: 300
  tool_timeout_seconds: 45
fixture:
  resources:
    - resource: networkpolicy/dependency-ingress
      patch_type: merge
      patch:
        spec:
          podSelector:
            matchLabels: {app: dependency}
          policyTypes: [Ingress]
          ingress:
            - from:
                - podSelector:
                    matchLabels: {app: frontend-v1}
              ports:
                - {protocol: TCP, port: 8080}
          egress: null
    - resource: networkpolicy/frontend-egress
      patch_type: merge
      patch:
        spec:
          podSelector:
            matchLabels: {app: frontend}
          policyTypes: [Egress]
          ingress: null
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: openshift-dns
                  podSelector:
                    matchLabels:
                      dns.operator.openshift.io/daemonset-dns: default
              ports:
                - {protocol: UDP, port: 5353}
                - {protocol: TCP, port: 5353}
verification:
  frontend_pod_selector: app=frontend
  dependency_pod_selector: app=dependency
  frontend_container: frontend
  dependency_container: dependency
  service: dependency
  ingress_policy: dependency-ingress
  egress_policy: frontend-egress
  dependency_port: 8080
  dependency_protocol: TCP
  dns_resolved_log_marker: "DNS resolved dependency to"
  dependency_success_log_prefix: "Dependency check succeeded:"
  dependency_log_prefixes:
    - "Dependency check succeeded:"
    - "Dependency connection failed:"
    - "Dependency DNS lookup failed:"
  dns_rule:
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-dns
        podSelector:
          matchLabels:
            dns.operator.openshift.io/daemonset-dns: default
    ports:
      - {protocol: UDP, port: 5353}
      - {protocol: TCP, port: 5353}
  expected_ingress_policy_spec:
    podSelector:
      matchLabels: {app: dependency}
    policyTypes: [Ingress]
    ingress:
      - from:
          - podSelector:
              matchLabels: {app: frontend}
        ports:
          - {protocol: TCP, port: 8080}
  expected_egress_policy_spec:
    podSelector:
      matchLabels: {app: frontend}
    policyTypes: [Egress]
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: openshift-dns
            podSelector:
              matchLabels:
                dns.operator.openshift.io/daemonset-dns: default
        ports:
          - {protocol: UDP, port: 5353}
          - {protocol: TCP, port: 5353}
      - to:
          - podSelector:
              matchLabels: {app: dependency}
        ports:
          - {protocol: TCP, port: 8080}
